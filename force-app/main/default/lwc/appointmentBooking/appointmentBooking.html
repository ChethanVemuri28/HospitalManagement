<template>

    <lightning-card title="Book Appointment">

        <div class="slds-p-around_medium">

            <lightning-record-picker
                label="Patient"
                placeholder="Search Patient..."
                object-api-name="Patient__c"
                onchange={handlePatientChange}>
            </lightning-record-picker>

            <div class="slds-m-top_medium">

                <lightning-record-picker
                    label="Doctor"
                    placeholder="Search Doctor..."
                    object-api-name="Doctor__c"
                    onchange={handleDoctorChange}>
                </lightning-record-picker>

            </div>

            <div class="slds-m-top_medium">

                <!-- <lightning-input
                    type="datetime"
                    label="Appointment Date & Time"
                    value={appointmentDate}
                    onchange={handleDateChange}>
                </lightning-input> -->
                <lightning-input
                    type="datetime"
                    label="Appointment Date & Time"
                    value={appointmentDate}
                    onchange={handleDateChange}
                    required>
                </lightning-input>

            </div>

            <div class="slds-m-top_medium">

                <lightning-textarea
                    label="Notes"
                    value={notes}
                    onchange={handleNotesChange}>
                </lightning-textarea>

            </div>

            <div class="slds-m-top_medium">

                <lightning-button
                    label="Check Availability"
                    variant="neutral"
                    onclick={handleCheckAvailability}
                    disabled={isChecking}>
                </lightning-button>

                <lightning-button
                    class="slds-m-left_small"
                    label="Book Appointment"
                    variant="brand"
                    onclick={handleBook}
                    disabled={isBooking}>
                </lightning-button>

            </div>

            <template if:true={isAvailable}>

                <div class="slds-m-top_medium slds-text-color_success">
                    ✓ Appointment slot is available.
                </div>

            </template>

        </div>

    </lightning-card>

</template>
