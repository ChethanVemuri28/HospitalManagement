<template>

    <lightning-card title="Appointment Management">

        <div class="slds-p-around_medium">

            <div class="slds-grid slds-gutters">

                <div class="slds-col">

                    <lightning-input
                        type="search"
                        label="Search"
                        placeholder="Search patient or doctor..."
                        value={searchTerm}
                        onchange={handleSearch}>
                    </lightning-input>

                </div>

                <div class="slds-col">

                    <lightning-combobox
                        label="Status"
                        value={statusFilter}
                        options={statusOptions}
                        onchange={handleStatusChange}>
                    </lightning-combobox>

                </div>

            </div>


            <div class="slds-m-top_medium">

                <template
                    if:true={filteredAppointments.length}>

                    <div class="slds-scrollable_x">

                        <table
                            class="slds-table
                                   slds-table_cell-buffer
                                   slds-table_bordered
                                   slds-table_striped">

                            <thead>

                                <tr>

                                    <th>Appointment</th>
                                    <th>Patient</th>
                                    <th>Doctor</th>
                                    <th>Date & Time</th>
                                    <th>Status</th>
                                    <th>Action</th>

                                </tr>

                            </thead>

                            <tbody>

                                <template
                                    for:each={filteredAppointments}
                                    for:item="appointment">

                                    <tr
                                        key={appointment.Id}>

                                        <td>
                                            {appointment.Name}
                                        </td>

                                        <td>
                                            {appointment.Patient__r.Name}
                                        </td>

                                        <td>
                                            {appointment.Doctor__r.Name}
                                        </td>

                                        <td>
                                            {appointment.formattedAppointmentDate}
                                        </td>

                                        <td>
                                            {appointment.Status__c}
                                        </td>

                                        <td>

                                            <template lwc:if={appointment.canTakeAction}>
                                                <div class="slds-m-left_auto">
                                                    <lightning-button
                                                        label="Reschedule"
                                                        variant="neutral"
                                                        data-id={appointment.Id}
                                                        onclick={handleRescheduleClick}>
                                                    </lightning-button>
                                                    <lightning-button
                                                        label="Cancel"
                                                        variant="destructive-text"
                                                        data-id={appointment.Id}
                                                        onclick={handleCancel}>
                                                    </lightning-button>

                                                    <lightning-button
                                                        label="Completed"
                                                        variant="neutral"
                                                        data-id={appointment.Id}
                                                        onclick={handleComplete}>
                                                    </lightning-button>
                                                </div>
                                            </template>

                                        </td>

                                    </tr>

                                </template>

                            </tbody>

                        </table>

                    </div>

                </template>


                <template
                    if:false={filteredAppointments.length}>

                    <div
                        class="slds-align_absolute-center
                               slds-p-around_large">

                        No appointments found.

                    </div>

                </template>

            </div>

        </div>

        <!-- Reschedule Appointment Modal -->
        <template if:true={showRescheduleForm}>
            <section
                role="dialog"
                tabindex="-1"
                aria-modal="true"
                class="slds-modal slds-fade-in-open">

                <div class="slds-modal__container">

                    <!-- Header -->
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">
                            Reschedule Appointment
                        </h2>
                    </header>

                    <!-- Body -->
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-input
                            type="datetime"
                            label="New Appointment Date & Time"
                            value={newAppointmentDate}
                            onchange={handleNewDateChange}
                            required>
                        </lightning-input>
                    </div>

                    <!-- Footer -->
                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Save Changes"
                            variant="brand"
                            onclick={handleRescheduleSave}
                            disabled={isRescheduling}>
                        </lightning-button>

                        <lightning-button
                            label="Close"
                            variant="neutral"
                            onclick={handleRescheduleCancel}
                            disabled={isRescheduling}
                            class="slds-m-left_small">
                        </lightning-button>
                    </footer>

                </div>
            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>

</template>
